<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Image Email Assignment</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/main.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
  <link rel="manifest" href="assets/icons/site.webmanifest">
</head>

<body id="top">

<header class="header">
  <div class="container">
    <h1>
      <i class="fa-regular fa-images"></i>
      Image Email Assignment
    </h1>
    <p>Assign images to one or more email addresses.</p>
  </div>
</header>

<main>

  <section class="image-section">
    <div class="container">

      <div class="image-card">

        <div class="image-card__wrapper">
          <img
            id="current-image"
            src="https://picsum.photos/600/400"
            alt="Random image">
        </div>

        <p class="image-card__status">
          Current image ready for assignment
        </p>

        <div class="image-card__controls">

          <button id="new-image-btn" class="image-card__btn">
            <i class="fa-solid fa-rotate"></i>
          </button>

        </div>

      </div>

      </div>
  </section>

  <section class="assignment-section">
    <div class="container assignment-section__container">

      <h2 class="assignment-section__title">Assign Image</h2>

      <form id="assignment-form">

        <div class="assignment-form__group">
          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            inputmode="email"
            placeholder="example@email.com"
            aria-describedby="email-error"
            required>
        </div>

        <button type="submit" class="btn btn-primary">
          <i class="fa-solid fa-link"></i>
          Assign Image
        </button>

      </form>

    </div>
  </section>

  <section class="assignments-section">
    <div class="container">

      <h2 class="assignments-section__title">Assigned Images</h2>

      <!-- "polite" - for not critical changes> -->
      <div
        id="assignments-container"
        class="assignments-section__container"
        aria-live="polite"
      ></div>

    </div>
  </section>

</main>

<footer class="footer">
  <div class="container footer__container">
    <div class="footer__info">
      <p>© 2026 Tatsiana Kashko</p>
      <p>JavaScript Arrays Project</p>
    </div>

    <div class="footer__socials">
      <a
        href="https://github.com/feafania"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="View GitHub profile"
      >
        <i class="fa-brands fa-github"></i>
        <span>GitHub</span>
      </a>
    </div>

  </div>
</footer>

<div id="notifications" aria-live="polite" role="status"></div>

<script src="js/jquery-4.0.0.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
